plugins { id 'com.android.application' }

android {
    namespace 'nz.ac.aut.comp713.fieldtasks'
    compileSdk 34
    defaultConfig {
        applicationId 'nz.ac.aut.comp713.fieldtasks'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'nz.ac.aut.comp713.fieldtasks.PayaraSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
